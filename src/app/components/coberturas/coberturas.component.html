<mat-card>
  <mat-card-title>Coberturas</mat-card-title>

  <form [formGroup]="form" #formDir="ngForm" (ngSubmit)="guardar(formDir)" class="form">
    <mat-form-field appearance="outline">
      <mat-label>Nombre de la cobertura</mat-label>
      <input matInput formControlName="nombre" maxlength="256" />
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">
        El nombre es obligatorio
      </mat-error>
    </mat-form-field>

    <button mat-flat-button color="primary" type="submit">
      {{ editandoId ? 'Actualizar' : 'Agregar' }}
    </button>
    <button mat-button type="button" *ngIf="editandoId" (click)="cancelar(formDir)">
      Cancelar
    </button>
  </form>

  <table mat-table [dataSource]="coberturas" *ngIf="coberturas.length; else vacio">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
      <td mat-cell *matCellDef="let c" class="col-acciones">
        <button mat-icon-button matTooltip="Editar" (click)="editar(c)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminar(c)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>

  <ng-template #vacio>
    <p class="vacio">Todavía no hay coberturas. ¡Agregá la primera!</p>
  </ng-template>
</mat-card>
