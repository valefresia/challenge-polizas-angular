<mat-card>
  <div class="encabezado">
    <mat-card-title>Pólizas</mat-card-title>
    <a mat-flat-button color="primary" routerLink="/polizas/nueva">
      <mat-icon>add</mat-icon> Nueva póliza
    </a>
  </div>

  <table mat-table [dataSource]="polizas" *ngIf="polizas.length; else vacio">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="cantidad">
      <th mat-header-cell *matHeaderCellDef>Coberturas</th>
      <td mat-cell *matCellDef="let p">{{ p.cantidad }}</td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef class="num">Monto total</th>
      <td mat-cell *matCellDef="let p" class="num">{{ p.total | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
      <td mat-cell *matCellDef="let p" class="col-acciones">
        <a mat-icon-button matTooltip="Editar" [routerLink]="['/polizas', p.id, 'editar']">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminar(p)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>

  <ng-template #vacio>
    <p class="vacio">Todavía no hay pólizas. ¡Creá la primera!</p>
  </ng-template>
</mat-card>
